{% extends "base.html" %}
{% block title %}Error {{ code }} - FoodieHub{% endblock %}
{% block content %}
<div class="container">
  <div class="empty-state">
    <div class="emoji">{{ '🔍' if code == 404 else '⚠️' }}</div>
    <h3>{{ code }} — {{ message }}</h3>
    <p>Let's get you back on track.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">Go Home</a>
  </div>
</div>
{% endblock %}
